plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.sawalef.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sawalef.app'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName "1.0.${ciVersionCode}-dev"
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
