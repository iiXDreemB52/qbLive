plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.sawalef.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sawalef.app'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName "1.1.${ciVersionCode}-dev"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'io.livekit:livekit-android:2.28.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}